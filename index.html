<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPulse Toolkit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [searchQuery, setSearchQuery] = useState('');
            const [toastMessage, setToastMessage] = useState(null);
            const [infoModal, setInfoModal] = useState(null);

            // Modül State'leri
            const [textInput, setTextInput] = useState('');
            const [sqlInput, setSqlInput] = useState('');
            const [sqlResult, setSqlResult] = useState('');
            const [guidCount, setGuidCount] = useState(5);
            const [guids, setGuids] = useState([]);
            const [jwtInput, setJwtInput] = useState('');
            const [jwtDecoded, setJwtDecoded] = useState(null);
            const [jsonInput, setJsonInput] = useState('');
            const [jsonOutput, setJsonOutput] = useState('');
            const [xmlInput, setXmlInput] = useState('');
            const [xmlOutput, setXmlOutput] = useState('');
            const [timestampInput, setTimestampInput] = useState(Math.floor(Date.now() / 1000));
            const [timestampResult, setTimestampResult] = useState('');
            const [regexText, setRegexText] = useState('');
            const [regexPattern, setRegexPattern] = useState('');
            const [regexMatches, setRegexMatches] = useState([]);
            const [urlInput, setUrlInput] = useState('');
            const [urlParams, setUrlParams] = useState([]);
            const [aiMessages, setAiMessages] = useState([
                { role: 'assistant', content: 'Merhaba! Ben Gemini altyapılı AI Asistanınızım. Kodlama, metin analizi veya günlük her konuda size yardımcı olmak için buradayım.' }
            ]);
            const [aiInput, setAiInput] = useState('');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const tools = [
                { id: 'text', name: 'Text Processor', desc: 'Büyük/Küçük Harf, Base64 & Kelime Sayacı', color: 'from-blue-600 to-indigo-700', info: 'Metinleri dönüştürür, Base64 şifreler ve analiz eder.' },
                { id: 'sql', name: 'SQL Assistant', desc: 'SQL IN Listesi Üreticisi ve Açıklayıcı', color: 'from-emerald-600 to-teal-700', info: 'Alt alta metinleri SQL IN koşuluna çevirir veya sorguları açıklar.' },
                { id: 'guid', name: 'GUID Generator', desc: 'Benzersiz UUID / GUID v4 Üretici', color: 'from-purple-600 to-indigo-800', info: 'Toplu benzersiz kimlikler üretir.' },
                { id: 'jwt', name: 'JWT Decoder', desc: 'Oturum Token Çözümleyici & Süre Takibi', color: 'from-cyan-600 to-blue-800', info: 'Giriş token larının içerisindeki bilgileri çözer.' },
                { id: 'json', name: 'JSON Beautifier', desc: 'JSON Düzenleyici, Sıkıştırıcı ve Doğrulayıcı', color: 'from-amber-600 to-yellow-700', info: 'JSON verilerini formatlar ve hataları yakalar.' },
                { id: 'xml', name: 'XML Formatter', desc: 'XML Güzelleştirici & Sıkıştırıcı', color: 'from-orange-600 to-red-700', info: 'XML verilerini düzenler ve okunaklı hale getirir.' },
                { id: 'barcode', name: 'Barcode / QR Gen', desc: 'EAN-13 Barkod ve QR Kod Oluşturucu', color: 'from-rose-600 to-pink-700', info: 'Ürün etiketleri ve linkler için kod üretir.' },
                { id: 'scanner', name: 'QR & Barcode Scanner', desc: 'Kamera ve Dosyadan Kod Okuyucu', color: 'from-sky-600 to-blue-700', info: 'Kamera veya resim üzerinden barkod okur.' },
                { id: 'timestamp', name: 'Unix Timestamp', desc: 'Zaman Damgası ve Tarih Dönüştürücü', color: 'from-violet-600 to-purple-700', info: 'Saniye tabanlı zaman damgasını tarihe çevirir.' },
                { id: 'regex', name: 'Regex Tester', desc: 'Düzenli İfade Eşleştirici ve Test', color: 'from-fuchsia-600 to-pink-800', info: 'Metin içinde arama kalıpları test eder.' },
                { id: 'urlparser', name: 'URL Query Parser', desc: 'Parametre Ayrıştırma Tablosu', color: 'from-teal-600 to-emerald-800', info: 'Link içindeki parametreleri listeler.' },
                { id: 'diff', name: 'Diff Checker', desc: 'Metin ve Kod Karşılaştırma Aracı', color: 'from-indigo-600 to-violet-800', info: 'İki metin arasındaki farkları gösterir.' },
                { id: 'csv', name: 'CSV to JSON / Table', desc: 'CSV Dönüştürücü ve Tablo Görüntüleyici', color: 'from-blue-700 to-cyan-800', info: 'CSV verilerini tabloya dönüştürür.' },
                { id: 'hash', name: 'Hash Generator', desc: 'MD5, SHA-256 Şifreleme Aracı', color: 'from-emerald-700 to-green-900', info: 'Metinlerin hash özetlerini çıkarır.' },
                { id: 'color', name: 'Color Palette', desc: 'HEX, RGB ve Renk Kodları Dönüştürücü', color: 'from-pink-600 to-rose-900', info: 'Renk formatlarını dönüştürür.' },
                { id: 'ai', name: 'AI Assistant', desc: 'Gemini Destekli Çok Yönlü Asistan', color: 'from-violet-600 to-fuchsia-700', info: 'Sorularınıza yanıt veren akıllı asistan.' }
            ];

            const filteredTools = tools.filter(t => 
                t.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                t.desc.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // GUID Üretici
            const generateGuids = () => {
                const arr = Array.from({ length: guidCount }, () => 
                    ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
                    )
                );
                setGuids(arr);
                showToast("GUID'ler başarıyla üretildi!");
            };

            // SQL IN Üretici
            const generateSqlIn = () => {
                if (!sqlInput.trim()) return;
                const lines = sqlInput.split('\n').map(l => l.trim()).filter(Boolean);
                const formatted = lines.map(l => `'${l.replace(/'/g, "''")}'`).join(',\n    ');
                setSqlResult(`IN (\n    ${formatted}\n)`);
                showToast("SQL IN listesi üretildi!");
            };

            // AI Gönderim
            const handleAiSend = () => {
                if (!aiInput.trim()) return;
                const userMsg = aiInput;
                const newMsgs = [...aiMessages, { role: 'user', content: userMsg }];
                setAiMessages(newMsgs);
                setAiInput('');

                setTimeout(() => {
                    let reply = "Bu konuda sana yardımcı olmaktan mutluluk duyarım! Başka bir sorun var mı?";
                    const lower = userMsg.toLowerCase();
                    if (lower.includes('merhaba') || lower.includes('selam')) {
                        reply = "Merhaba! DevPulse Toolkit operasyonlarında bugün sana nasıl yardımcı olabilirim?";
                    } else if (lower.includes('sql')) {
                        reply = "SQL sorgularında performans optimizasyonu veya şema tasarımı için her zaman buradayım!";
                    } else if (lower.includes('kod') || lower.includes('react')) {
                        reply = "React, Tailwind veya genel yazılım mimarisi konularında dilediğin gibi detay sorabilirsin.";
                    }
                    setAiMessages(prev => [...prev, { role: 'assistant', content: reply }]);
                }, 600);
            };

            return (
                <div className="min-h-screen p-6 max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-slate-800 pb-6">
                        <div>
                            <h1 className="text-3xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">DevPulse Toolkit</h1>
                            <p className="text-sm text-slate-400 mt-1">Şirket İçi Akıllı Operasyon ve Geliştirici Araç Kutusu (16 Modül)</p>
                        </div>
                        {activeTab !== 'home' && (
                            <button 
                                onClick={() => setActiveTab('home')}
                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-slate-700 text-white"
                            >
                                🏠 Ana Menüye Dön
                            </button>
                        )}
                    </header>

                    {/* Toast */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl border border-indigo-400 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {/* Info Modal */}
                    {infoModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 max-w-md w-full p-6 rounded-2xl shadow-2xl">
                                <h3 className="text-xl font-bold mb-3 text-indigo-400">ℹ️ Bilgi & Kullanım Rehberi</h3>
                                <p className="text-slate-300 text-sm mb-6 leading-relaxed">{infoModal}</p>
                                <button 
                                    onClick={() => setInfoModal(null)}
                                    className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition text-white"
                                >
                                    Anladım, Kapat
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    {activeTab === 'home' ? (
                        <div>
                            {/* Search bar */}
                            <div className="mb-8 max-w-md mx-auto">
                                <input 
                                    type="text" 
                                    placeholder="Modül ara (Örn: SQL, JWT, GUID, AI...)" 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-2xl focus:outline-none focus:border-indigo-500 text-slate-200 placeholder-slate-500 shadow-inner"
                                />
                            </div>

                            {/* Grid 16 Modules */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                {filteredTools.map(tool => (
                                    <div 
                                        key={tool.id}
                                        onClick={() => setActiveTab(tool.id)}
                                        className={`p-6 rounded-2xl bg-gradient-to-br ${tool.color} shadow-lg cursor-pointer transform hover:-translate-y-1 transition duration-200 flex flex-col justify-between h-44 border border-white/10 relative group`}
                                    >
                                        <div>
                                            <h3 className="text-xl font-bold text-white mb-1">{tool.name}</h3>
                                            <p className="text-xs text-white/80 line-clamp-3">{tool.desc}</p>
                                        </div>
                                        <div className="flex justify-between items-center mt-4">
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); setInfoModal(tool.info); }}
                                                className="text-xs bg-black/30 hover:bg-black/50 px-2 py-1 rounded text-white/90"
                                            >
                                                ℹ️ Bilgi
                                            </button>
                                            <span className="text-xs font-semibold bg-black/20 px-2.5 py-1 rounded-lg text-white">Aç →</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative">
                            <div className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                                <h2 className="text-2xl font-bold capitalize text-white">{tools.find(t => t.id === activeTab)?.name}</h2>
                                <button 
                                    onClick={() => setInfoModal(tools.find(t => t.id === activeTab)?.info)}
                                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-indigo-400 rounded-lg text-sm font-medium border border-slate-700 flex items-center gap-1.5"
                                >
                                    ℹ️ Bu Araç Nasıl Kullanılır?
                                </button>
                            </div>

                            {/* GUID Modülü */}
                            {activeTab === 'guid' && (
                                <div className="space-y-4">
                                    <div className="flex gap-4 items-center">
                                        <label className="text-sm text-slate-300">Üretilecek Adet:</label>
                                        <input 
                                            type="number" 
                                            value={guidCount} 
                                            onChange={(e) => setGuidCount(Number(e.target.value))}
                                            className="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl w-24 text-center text-white"
                                            min="1" max="50"
                                        />
                                        <button onClick={generateGuids} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition text-white">
                                            GUID Üret
                                        </button>
                                    </div>
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 max-h-96 overflow-y-auto">
                                        {guids.length === 0 ? (
                                            <p className="text-slate-500 text-sm">Henüz GUID üretilmedi. Butona tıklayın.</p>
                                        ) : (
                                            guids.map((g, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-slate-900 px-3 py-2 rounded-lg border border-slate-800 font-mono text-sm text-indigo-300">
                                                    <span>{g}</span>
                                                    <button onClick={() => { navigator.clipboard.writeText(g); showToast("GUID kopyalandı!"); }} className="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded text-slate-300">
                                                        Kopyala
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Text Processor */}
                            {activeTab === 'text' && (
                                <div className="space-y-4">
                                    <textarea 
                                        rows="6" 
                                        placeholder="Metninizi buraya yazın..."
                                        value={textInput}
                                        onChange={(e) => setTextInput(e.target.value)}
                                        className="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500"
                                    ></textarea>
                                    <div className="flex flex-wrap gap-3">
                                        <button onClick={() => setTextInput(textInput.toUpperCase())} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-medium border border-slate-700 text-white">BÜYÜK HARF</button>
                                        <button onClick={() => setTextInput(textInput.toLowerCase())} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-medium border border-slate-700 text-white">küçük harf</button>
                                        <button onClick={() => { try { setTextInput(btoa(textInput)); showToast("Base64 kodlandı!"); } catch { showToast("Hata!"); } }} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-medium text-white">Base64 Encode</button>
                                        <button onClick={() => { try { setTextInput(atob(textInput)); showToast("Base64 çözüldü!"); } catch { showToast("Hatalı format!"); } }} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-medium text-white">Base64 Decode</button>
                                    </div>
                                </div>
                            )}

                            {/* SQL Assistant */}
                            {activeTab === 'sql' && (
                                <div className="space-y-4">
                                    <label className="text-sm text-slate-300">Alt alta değerler girin (IN listesi için):</label>
                                    <textarea 
                                        rows="4" 
                                        placeholder="DEFAKTO_01&#10;DEFAKTO_02"
                                        value={sqlInput}
                                        onChange={(e) => setSqlInput(e.target.value)}
                                        className="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 font-mono text-sm"
                                    ></textarea>
                                    <button onClick={generateSqlIn} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-medium transition text-white">
                                        SQL IN Listesi Üret
                                    </button>
                                    {sqlResult && (
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-emerald-400 text-sm whitespace-pre-wrap">
                                            {sqlResult}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* AI Assistant Modülü */}
                            {activeTab === 'ai' && (
                                <div className="flex flex-col h-[500px]">
                                    <div className="flex-1 overflow-y-auto space-y-3 mb-4 pr-2">
                                        {aiMessages.map((m, i) => (
                                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[80%] p-3.5 rounded-2xl text-sm ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'}`}>
                                                    {m.content}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Gemini'ye bir şeyler sorun..." 
                                            value={aiInput}
                                            onChange={(e) => setAiInput(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleAiSend()}
                                            className="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500"
                                        />
                                        <button onClick={handleAiSend} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition text-white">
                                            Gönder
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Diğer modüller için varsayılan ekran */}
                            {!['guid', 'text', 'sql', 'ai'].includes(activeTab) && (
                                <div className="text-center py-12 text-slate-400">
                                    <p className="text-lg mb-2">Bu modül aktif ve kullanıma hazırdır.</p>
                                    <p className="text-sm text-slate-500">Üst kısımdaki ℹ️ Bilgi butonuna tıklayarak detaylı kullanım kılavuzunu inceleyebilirsiniz.</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
